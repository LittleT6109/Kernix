name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          tar -czf kernix-${{ github.ref_name }}.tar.gz \
            --exclude=.git \
            .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "kernix-${{ github.ref_name }}.tar.gz" \
            "docker-compose.yml" \
            --generate-notes
